{% extends "base.html" %}

{% block links %} 
    <link rel="stylesheet" href= "{{ url_for('chat.static', filename='css/style.css')}}">
{% endblock %}

{% block content %}
<div class="register">
    <a class="register_loginbtn">Увійти</a>
    <div class="register_logo">
        <img class="register_logo_img" src="{{ url_for('static', filename='images/reg_logo.png') }}" alt="WORLD IT">
    </div>

    <h2 class="register_title">Створити обліковий запис</h2>

    <form class="register_form" method="post">
        <label class="field">
            <p class="field_label"><span class="field_label_long">Введіть вашу електронну пошту нижче, щоб створити обліковий запис</span><span class="field_label_short">Електронна пошта</span></p>
            <input class="field_input" type="email" name="email" placeholder="name@example.com" required autocomplete="email" value="{{ email | default('', true) }}">
        </label>

        <label class="field">
            <p class="field_label"><span class="field_label_long">Задайте ваш пароль нижче, щоб створити обліковий запис</span><span class="field_label_short">Пароль</span></p>
            <input class="field_input" type="password" name="password" placeholder="*************" required minlength="8" autocomplete="new-password">
        </label>
        
        <label class="field">
            <p class="field_label"><span class="field_label_long">Перевірка паролю</span><span class="field_label_short">Повторіть пароль</span></p>
            <input class="field_input" type="password" name="confirm_password" placeholder="*************" required minlength="8" autocomplete="new-password">
        </label>

        {% if error %}
            <p class="register_error">{{ error }}</p>
        {% endif %}

        <button class="register_submit" type="submit">Надіслати посилання для підтвердження</button>
    </form>

    <p class="register_terms">
        Натискаючи «Продовжити», ви погоджуєтеся з нашими<br>Умовами обслуговування та Політикою конфіденційності
    </p>

    <div class="register_png">
        <img class="register_png_img" src="{{ url_for('static', filename='images/ChildrenWithPc.png') }}" alt="children with pc">
    </div>
    
</div>
{% endblock %}
