{% extends "base.html" %}

{% block links %} 
    <link rel="stylesheet" href= "{{ url_for('chat.static', filename='css/style.css')}}">
{% endblock %}

{% block content %}
<div class="register">
    <a class="register_loginbtn" href="{{ url_for('chat.render_auth') }}">Увійти</a>
    <div class="register_logo">
        <img class="register_logo_img" src="{{ url_for('static', filename='images/reg_logo.png') }}" alt="WORLD IT">
    </div>

    <h2 class="register_title">Створити обліковий запис</h2>

    <form class="register_form" method="post">
        <label class="field">
            <p class="field_label">Введіть вашу електронну пошту нижче, щоб створити обліковий запис</p>
            <input class="field_input" type="email" name="email" placeholder="name@example.com" required autocomplete="email" value="{{ email | default('', true) }}">
        </label>

    <div class="field">
        <label class="field_label" for="password">
            Задайте ваш пароль нижче, щоб створити обліковий запис
        </label>

        <div class="password_div">
            <input class="field_input" id="password" type="password" name="password" placeholder="*************" required minlength="8" autocomplete="new-password">
            <button class="password_toggle" type="button" aria-label="Показати пароль">
                <img src="{{ url_for('static', filename='images/eye.svg') }}" alt="">
            </button>
        </div>
    </div>
        
    <div class="field">
        <label class="field_label" for="confirm_password">
            Перевірка паролю
        </label>

        <div class="password_div">
            <input class="field_input" id="confirm_password" type="password" name="confirm_password" placeholder="*************" required minlength="8" autocomplete="new-password">
            <button class="password_toggle" type="button" aria-label="Показати пароль">
                <img src="{{ url_for('static', filename='images/eye.svg') }}" alt="">
            </button>
        </div>
    </div>
        

        {% if error %}
            <p class="register_error">{{ error }}</p>
        {% endif %}

        <button class="register_submit" type="submit">Надіслати посилання для підтвердження</button>
    </form>

    <p class="register_terms">
        Натискаючи «Продовжити», ви погоджуєтеся з нашими<br>Умовами обслуговування та Політикою конфіденційності
    </p>

    <div class="register_png">
        <img class="register_png_img" src="{{ url_for('static', filename='images/ChildrenWithPc.png') }}" alt="children with pc">
    </div>
    
</div>

<script src="{{ url_for('chat.static', filename='js/password.js') }}"></script>
{% endblock %}
