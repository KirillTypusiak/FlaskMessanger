<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        .outside-table{
            width: 100%;
            border: 1px solid #b4b6c6;
            border-radius: 12px;
        }

        .inside-table{
            width: 100%;
            max-width: 550px;
        }

        .letter-title{
            font-size: 28px;
            margin: 0 0 24px;
        }

        .top-letter-paragraph{
            font-size: 16px;
            line-height: 1.3;
        }

        .confirm-letter-button{
            display: block;
            text-align: center;
            padding: 10px 0;
            background-color: #090b1c;
            border-radius: 8px;
        }

        .image-letter{
            width: 100%;
            max-width: 340px;
            height: auto;
        }

        .bottom-letter-paragraph{
            font-size: 14px;
        }

        hr {
            border: none;
            border-top: 1px solid #b4b6c6;
        }


    </style>
</head>
<body style = "font-family: Arial, sans-serif; color: #090b1c;">
    <table class="outside-table" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center" style="padding: 32px 20px 48px;">
                <table class="inside-table" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                    <td>
                        <h1 class="letter-title">Вас вітає команда World IT !</h1>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p class="top-letter-paragraph">
                            Щоб завершити реєстрацію та переконатися, що саме ви є власником цієї електронної адреси,
                            будь ласка, підтвердіть свою пошту.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <a class="confirm-letter-button" href="{{ verification_url }}" style="color: #ffffff !important; text-decoration: none;">Підтвердити пошту</a>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding: 30px 0;">
                        <img class="image-letter" src="{{ image_url }}" alt="children with pc">
                    </td>
                </tr>
                <tr>
                    <td>
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p class="bottom-letter-paragraph">
                            Якщо у вас виникнуть питання - ми завжди раді допомогти!<br>
                            З найкращими побажаннями, команда World IT Academy
                        </p>
                    </td>
                </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
